name: nutri_ai
description: NutriAI, private AI nutrition and fitness tracker (Flutter web app + iOS project)
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management and navigation
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0

  # Device settings (onboarding flag, pending profile photo)
  shared_preferences: ^2.2.2

  # UI
  fl_chart: ^0.66.2
  percent_indicator: ^4.2.3
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # Camera and photos
  camera: ^0.10.5+9
  image_picker: ^1.0.7

  # Backend: auth, database, storage, edge functions
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
