<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `--base-href` when building. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NutriAI: private AI nutrition and fitness tracker">
  <meta name="theme-color" content="#0D1117">
  <meta name="color-scheme" content="dark">

  <!-- iPhone "Add to Home Screen": full screen app with its own icon -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NutriAI">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>NutriAI</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0D1117;
      overscroll-behavior: none;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #0D1117;
      transition: opacity 0.3s ease;
      z-index: 9999;
    }
    #splash img {
      width: 112px;
      height: 112px;
      border-radius: 26px;
    }
    #splash .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(76, 175, 80, 0.25);
      border-top-color: #4CAF50;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash .credit {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      text-align: center;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.3px;
      color: #768390;
    }
    #splash .credit b {
      color: #B0B8C4;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-512.png" alt="NutriAI">
    <div class="spinner"></div>
    <div class="credit">Powered by <b>Ahmed Ben Hassen</b></div>
  </div>
  <script>
    // Hide the loading screen as soon as Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) {
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
